<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Golpe Zero: mande a mensagem ou o print suspeito e descubra em segundos se é golpe, por quê e o que fazer.">
  <meta name="theme-color" content="#1e4fd8">
  <title>Golpe Zero — É golpe? Descubra antes de agir</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/AtkinsonHyperlegible-Regular.woff2" as="font" type="font/woff2" crossorigin>

<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <nav class="nav-baixo" aria-label="Navegação" id="nav-baixo"></nav>

  <footer class="rodape">
