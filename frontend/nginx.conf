server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    # JS/CSS: revalida sempre (ETag) -> depois de um deploy ninguém fica com
    # módulos de versões diferentes misturados
    location ~* \.(css|js|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }
    # fontes e imagens mudam pouco: cache longo (menos dados móveis)
    location ~* \.(woff2|svg|png|jpg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;
}
