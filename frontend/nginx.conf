server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
    }
    # arquivos estáticos podem ficar em cache no celular (menos dados móveis)
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
    gzip on;
    gzip_types text/css application/javascript;
}
