# Política de cache por tipo de arquivo, num único lugar (map + um add_header no
# server). add_header dentro de location sobrescreveria os demais cabeçalhos —
# o Semgrep barrou essa versão (generic.nginx.security.header-redefinition).
map $uri $golpezero_cache {
    ~*\.(woff2|svg|png|jpg)$  "public, max-age=604800";  # fontes/imagens: 7 dias (menos dados móveis)
    default                   "no-cache";                # HTML/JS/CSS: revalida sempre (ETag)
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header Cache-Control $golpezero_cache always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;
}
