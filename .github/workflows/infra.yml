# Infraestrutura como código: plan em todo push que mexe em infra/,
# apply automático só na main (environment "producao", login OIDC).
# State remoto no Storage Account (nunca no repositório).
name: infra

on:
  push:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-prod # nunca dois applies ao mesmo tempo
  cancel-in-progress: false

jobs:
  terraform:
    if: vars.AZURE_PRONTO == 'true'
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: init (backend remoto)
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}"
      - run: terraform plan -input=false -out=tfplan
      - name: apply (só main)
        if: github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
