# Alertas do Golpe Zero (Grafana Unified Alerting, provisionados por arquivo).
# Para demonstrar um alerta disparado: scripts/disparar-alerta.sh
apiVersion: 1
groups:
  - orgId: 1
    name: golpe-zero-producao
    folder: Golpe Zero
    interval: 30s
    rules:
      - uid: gz-fora-do-ar
        title: "MVP fora do ar"
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        labels: { severidade: critica, servico: golpe-zero }
        annotations:
          summary: "O Prometheus não consegue ler o MVP há mais de 1 minuto. Idosos não estão recebendo resposta."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'min(up{job="golpe-zero-api"})' }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      - uid: gz-taxa-erro
        title: "Taxa de erro acima de 5%"
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Alerting
        labels: { severidade: alta, servico: golpe-zero }
        annotations:
          summary: "Mais de 5% das análises falharam (HTTP 5xx ou LLM sem resposta) nos últimos 5 minutos."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                (
                  (sum(rate(http_requests_total{handler=~"/api/.*",status=~"5.."}[5m])) or vector(0))
                  + (sum(rate(golpezero_falhas_llm_total[5m])) or vector(0))
                ) / clamp_min(sum(rate(http_requests_total{handler=~"/api/.*"}[5m])), 0.0001)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0.05] } }]

      - uid: gz-latencia-p95
        title: "Latência p95 acima de 45 s"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels: { severidade: media, servico: golpe-zero }
        annotations:
          summary: "O p95 das análises passou de 45 s por 5 minutos (CPU da VM saturada?)."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{handler=~"/api/analisar/.*"}[5m])))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [45] } }]
