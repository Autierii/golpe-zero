# Prometheus na VM, lendo os alvos pela rede interna do docker compose.
# (De fora, /metrics só responde com token — ver deploy/Caddyfile.)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    ambiente: producao
    app: golpe-zero

scrape_configs:
  - job_name: golpe-zero-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: golpe-zero-vm
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
